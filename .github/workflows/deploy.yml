name: Build, Tag, and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Extract Commit SHA
      - name: Set Short Commit SHA
        id: vars
        run: echo "SHA_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ==========================================
      # BACKEND PIPELINE
      # ==========================================

      # Step A: BUILD
      - name: Build Backend Image
        run: |
          docker build -t card-backend:local ./backend

      # Step B: TAG
      - name: Tag Backend Image
        run: |
          IMAGE_URI=ghcr.io/${{ github.repository }}/backend
          docker tag card-backend:local ${IMAGE_URI}:${{ steps.vars.outputs.SHA_TAG }}
          docker tag card-backend:local ${IMAGE_URI}:latest

      # Step C: PUSH
      - name: Push Backend Image
        run: |
          IMAGE_URI=ghcr.io/${{ github.repository }}/backend
          docker push ${IMAGE_URI}:${{ steps.vars.outputs.SHA_TAG }}
          docker push ${IMAGE_URI}:latest

      # ==========================================
      # FRONTEND PIPELINE
      # ==========================================

      # Step A: BUILD
      - name: Build Frontend Image
        run: |
          docker build -t card-frontend:local ./frontend

      # Step B: TAG
      - name: Tag Frontend Image
        run: |
          IMAGE_URI=ghcr.io/${{ github.repository }}/frontend
          docker tag card-frontend:local ${IMAGE_URI}:${{ steps.vars.outputs.SHA_TAG }}
          docker tag card-frontend:local ${IMAGE_URI}:latest

      # Step C: PUSH
      - name: Push Frontend Image
        run: |
          IMAGE_URI=ghcr.io/${{ github.repository }}/frontend
          docker push ${IMAGE_URI}:${{ steps.vars.outputs.SHA_TAG }}
          docker push ${IMAGE_URI}:latest