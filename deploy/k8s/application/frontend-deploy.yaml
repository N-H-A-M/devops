apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secrets
      containers:
        - name: frontend
          image: ghcr.io/n-h-a-m/devops/frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "/api"