apiVersion: v1
kind: Namespace
metadata:
  name: database
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    argocd.argoproj.io/sync-wave: "-1"   # negative = applied before wave "0" (the default for everything else)
  labels:
    name: database
---
apiVersion: v1
kind: Namespace
metadata:
  name: application
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    argocd.argoproj.io/sync-wave: "-1"   # negative = applied before wave "0" (the default for everything else)
  labels:
    name: application

