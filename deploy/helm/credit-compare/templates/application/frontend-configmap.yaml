apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-frontend-nginx-config"
  namespace: {{ .Values.backend.namespace | default "application" }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      # Non-root writable temporary directories
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp_path;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      # Internal Kubernetes DNS resolver
      resolver 10.96.0.10 valid=30s;

      server {
        # Listen on non-root port 8080 (or port 80 if running as root)
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Single Page Application (SPA) routing
        location / {
          try_files $uri $uri/ /index.html;
        }

        # Cache Next.js / frontend static assets
        location /_next/static/ {
          alias /usr/share/nginx/html/_next/static/;
          expires 1y;
          access_log off;
        }

        # Reverse proxy to backend service in 'application' namespace
        location /api/ {
          proxy_pass http://{{ .Release.Name }}-backend-service.{{ .Values.backend.namespace | default "application" }}.svc.cluster.local:8080/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
      }
    }