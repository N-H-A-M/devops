apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: credit-compare-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/N-H-A-M/devops.git' # Your Git Repo URL
    targetRevision: dev
    path: helm/credit-compare                           # Path to your Helm chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: database                                  # Target namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true